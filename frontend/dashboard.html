<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payanamatic | Officer Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <div class="logo">Payanam<span>atic</span></div>
  <ul class="nav-links">
    <li><a href="index.html">Screening</a></li>
    <li><a href="dashboard.html" class="active">Officer Dashboard</a></li>
  </ul>
</nav>

<main class="container">

  <section class="card full">
    <h2>Overview</h2>
    <div class="stats">
      <div class="stat-box">
        <h3 id="total">0</h3>
        <p>Total Screenings</p>
      </div>
      <div class="stat-box tone-good">
        <h3 id="verified">0</h3>
        <p>Verified</p>
      </div>
      <div class="stat-box tone-warn">
        <h3 id="manual">0</h3>
        <p>Manual Review</p>
      </div>
    </div>

    <div class="stats">
      <div class="stat-box tone-good">
        <h3 id="low">0</h3>
        <p>Low Risk</p>
      </div>
      <div class="stat-box tone-warn">
        <h3 id="medium">0</h3>
        <p>Medium Risk</p>
      </div>
      <div class="stat-box tone-danger">
        <h3 id="high">0</h3>
        <p>High Risk</p>
      </div>
    </div>
  </section>

  <section class="card full">
    <div class="section-header">
      <h2>Recent Screenings</h2>
      <div class="header-actions">
        <button type="button" class="ghost" id="refreshBtn">Refresh</button>
        <button type="button" class="secondary" id="clearBtn">Clear</button>
      </div>
    </div>
    <p class="field-hint" id="dashboardHint"></p>

    <div class="table-wrap">
      <table id="screeningTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Passport</th>
            <th>Risk</th>
            <th>Status</th>
            <th>Decision</th>
            <th>Time</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <p class="empty-state" id="emptyState" hidden>No screenings recorded yet.</p>
    </div>
  </section>

</main>

<script src="dashboard.js"></script>
</body>
</html>
